[package]
name = "inifra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "A CLI for bootstrapping reusable project files from templates"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
clap_complete = { version = "4.6.12", features = ["unstable-dynamic"] }
directories = "6.0.0"
inifra-assistant = { version = "0.5.0", path = "../inifra-assistant" }
inifra-core = { version = "0.5.0", path = "../inifra-core" }
inifra-tui = { version = "0.5.0", path = "../inifra-tui" }
shlex = "2.0.1"
tempfile = "3.27.0"
