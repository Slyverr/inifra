[package]
name = "inifra-assistant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Assistant workflows and provider integrations for Inifra"

[lints]
workspace = true

[dependencies]
async-stream = "0.3.6"
futures-util = "0.3.31"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
toml = "1.2.1"
url = "2.5.8"

