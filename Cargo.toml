[workspace]
members = [
    "crates/inifra",
    "crates/inifra-core",
    "crates/inifra-assistant",
    "crates/inifra-tui",
]
resolver = "3"

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Slyverr/inifra"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Line tables keep backtraces readable while cutting debug-build and test-link time.
[profile.dev]
debug = "line-tables-only"

# Dependencies are rarely stepped through, so skip their debug info to shorten cold builds.
[profile.dev.package."*"]
debug = false
