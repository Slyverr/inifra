[workspace]
members = [
    "crates/inifra",
    "crates/inifra-core",
    "crates/inifra-assistant",
    "crates/inifra-tui",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Slyverr/inifra"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
