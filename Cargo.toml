[package]
name = "inifra"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "CLI for adding reusable starter files to a project"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Slyverr/inifra"
include = [
  "/Cargo.lock",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/docs/**",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
  "/README.md",
  "/src/**",
  "/templates/**",
  "/tests/**",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
console = "0.16"
crossterm = "0.29"
dirs = "6"
dialoguer = "0.12"
minijinja = "2.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
toml = "0.8"
tempfile = "3"
unicode-width = "0.2"
