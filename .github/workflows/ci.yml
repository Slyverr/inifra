name: CI

on:
  push:
    branches: ['**']
    tags: ["v*"]
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      - name: Install stable Rust tools
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo +stable test --workspace --locked

  minimum-rust-version:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minimum Rust version
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Check and test
        run: |
          cargo +1.100.0 check --workspace --locked
          cargo +1.100.0 test --workspace --locked

  crate-packages:
    name: Verify crates.io packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Package and verify the workspace crates
        run: scripts/publish-crates.sh --dry-run

  nix-package:
    name: Nix package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check flake outputs
        run: nix flake check --no-write-lock-file
      - name: Build the package
        run: nix build .#inifra --no-link --print-build-logs
      - name: Smoke-test the installed command
        run: nix run .#inifra -- --version
      - name: Verify the development toolchain
        run: nix develop --command rustc --version

  release-metadata:
    name: Validate release tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Verify annotated tag target
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
      - name: Match tag, Cargo, and changelog versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/validate-release-tag.py

  release-assets:
    name: Build release archive (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, minimum-rust-version, nix-package, crate-packages, release-metadata]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable "${{ matrix.target }}"
        shell: bash
      - name: Build Inifra
        run: cargo +stable build --locked --release --package inifra --target "${{ matrix.target }}"
        shell: bash
      - name: Create release archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          archive_root="inifra-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/${archive_root}"
          binary="target/${TARGET}/release/inifra"
          if [[ "${TARGET}" == *windows* ]]; then binary="${binary}.exe"; fi
          cp "$binary" "dist/${archive_root}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${archive_root}/"
          tar -C dist -czf "dist/${archive_root}.tar.gz" "$archive_root"
          rm -rf "dist/${archive_root}"
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum -- ./*.tar.gz > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "Inifra $RELEASE_TAG"
          fi
