name: CI

on:
  push:
    branches: ['**']
    tags: ["v*"]
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stable-
      - name: Install stable Rust tools
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo +stable test --workspace --locked

  minimum-rust-version:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minimum Rust version
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Check and test
        run: |
          cargo +1.100.0 check --workspace --locked
          cargo +1.100.0 test --workspace --locked

  release-metadata:
    name: Validate release tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Verify annotated tag target
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
      - name: Match tag, Cargo, and changelog versions
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          manifest = json.loads(subprocess.check_output([
              "cargo", "+stable", "read-manifest", "--manifest-path", "crates/inifra/Cargo.toml"
          ], text=True))
          version = manifest["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}$", re.MULTILINE)

          if tag != f"v{version}":
              sys.exit(f"tag {tag!r} does not match Cargo version {version!r}")
          if not heading.search(changelog):
              sys.exit(f"CHANGELOG.md has no dated section for {version}")
          PY
